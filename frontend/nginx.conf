# SPA + API на одном origin: cookie сессии Я ID работает без CORS.
server {
    listen 80;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Vite кладёт в /assets файлы с хэшем в имени - их можно кэшировать навсегда.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Имя api резолвится через DNS Docker на каждый запрос (переменная в proxy_pass), а не один раз
    # при старте nginx: иначе после пересоздания контейнера api nginx ходит на старый IP и отдаёт 502.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:8000;

    location /api/ {
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location / {
        try_files $uri /index.html;
    }
}
